name: NACHGPT Role and Evidence Contract

on:
  pull_request:
    paths:
      - "server/nachgpt_contract.py"
      - "server/nachgpt_intent_router.py"
      - "server/nachgpt_operational_fallback.py"
      - "server/main.py"
      - "tests/test_nachgpt_*"
      - ".github/workflows/nachgpt-role-evidence.yml"
  push:
    branches: [main]
    paths:
      - "server/nachgpt_contract.py"
      - "server/nachgpt_intent_router.py"
      - "server/nachgpt_operational_fallback.py"
      - "server/main.py"
      - "tests/test_nachgpt_*"
      - ".github/workflows/nachgpt-role-evidence.yml"

permissions:
  contents: read

jobs:
  role-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run role, authorization and verified evidence suite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --disable-warnings \
            tests/test_nachgpt_role_answer_matrix.py \
            tests/test_nachgpt_purchase_evidence_contract.py \
            tests/test_nachgpt_contract.py \
            tests/test_nachgpt_milling_contract.py \
            tests/test_nachgpt_processor_run_contract.py \
            tests/test_nachgpt_history_privacy.py
